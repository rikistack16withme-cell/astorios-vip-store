services:
  - type: web
    name: astorrios-vip-store
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node start.js
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        value: AstorrIOS_bot
      - key: ADMIN_IDS
        value: "6805487598,7283817695"
      - key: GROUP_ID
        value: "-1003942921012"
      - key: PAYLINK_BASE_URL
        value: https://paylinkapi-bot.onrender.com
      - key: PAYLINK_API_KEY
        sync: false
      - key: PAYLINK_SECRET
        sync: false
      - key: MERCHANT_NAME
        value: AstorrIOS STORE
      - key: WEBAPP_URL
        sync: false
